name: event_app
description: "Event platform mobile app — Public Mode (discovery, registration, tickets) and Staff Mode (check-in, task review), backed by the existing event-platform-backend API."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (Section 3.2)
  flutter_riverpod: ^2.5.1

  # Navigation (Section 3.3)
  go_router: ^14.2.0

  # Networking (Section 3.5)
  dio: ^5.5.0
  url_launcher: ^6.3.1

  # Token storage (Section 3.4)
  flutter_secure_storage: ^9.2.2

  # Non-sensitive local preference persistence — e.g. which mode (Public /
  # Staff) the user last selected, so the switch (Section 3.3) survives an
  # app restart. Deliberately NOT used for tokens; those stay in
  # flutter_secure_storage exclusively.
  shared_preferences: ^2.3.2

  # Code 128 — 1D ticket display; mobile_scanner is constrained to Code 128
  # for Staff Mode scanning.
  barcode_widget: ^2.0.4
  mobile_scanner: ^5.2.3

  # Remote images — event covers, media gallery (from Phase 2 onward)
  cached_network_image: ^3.4.1

  # Connectivity awareness — Staff Mode offline check-in queue (from Phase 5 onward)
  connectivity_plus: ^6.0.5

  # Payments — Razorpay checkout sheet (from Phase 4 onward)
  razorpay_flutter: ^1.3.7

  # Production push token/lifecycle integration. Native Firebase configuration
  # is supplied by each deployment flavor, never committed as credentials.
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/illustrations/
  # fonts: intentionally left empty in Phase 1 — the design system (Section 5.2)
  # calls for a bundled variable font, added once the actual font files are
  # sourced; the theme falls back to the platform default until then rather
  # than referencing a font asset that doesn't exist yet.
